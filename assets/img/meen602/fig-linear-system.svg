<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="320" fill="#f7f7f5" rx="10" />

  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Testing linearity: superposition and scaling</text>

  <!-- bracket label: superposition -->
  <text x="20" y="70" font-size="13" font-weight="700" fill="#3a5a8c">Superposition</text>
  <path d="M 12 78 L 12 195 L 20 195" fill="none" stroke="#3a5a8c" stroke-width="1.5" />

  <!-- Row A -->
  <g transform="translate(0,55)">
    <text x="70" y="30" text-anchor="middle" font-size="16" fill="#1a1a1a">i₁</text>
    <line x1="90" y1="25" x2="150" y2="25" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" />
    <rect x="155" y="5" width="90" height="40" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" />
    <text x="200" y="30" text-anchor="middle" font-size="13" fill="#1a1a1a">System</text>
    <line x1="245" y1="25" x2="305" y2="25" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="325" y="30" text-anchor="middle" font-size="16" fill="#1a1a1a">r₁</text>
  </g>

  <!-- Row B -->
  <g transform="translate(0,105)">
    <text x="70" y="30" text-anchor="middle" font-size="16" fill="#1a1a1a">i₂</text>
    <line x1="90" y1="25" x2="150" y2="25" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" />
    <rect x="155" y="5" width="90" height="40" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" />
    <text x="200" y="30" text-anchor="middle" font-size="13" fill="#1a1a1a">System</text>
    <line x1="245" y1="25" x2="305" y2="25" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="325" y="30" text-anchor="middle" font-size="16" fill="#1a1a1a">r₂</text>
  </g>

  <!-- Row C (sum) -->
  <g transform="translate(0,160)">
    <text x="70" y="30" text-anchor="middle" font-size="16" fill="#8c3a3a">i₁ + i₂</text>
    <line x1="105" y1="25" x2="150" y2="25" stroke="#8c3a3a" stroke-width="1.5" marker-end="url(#arrowred)" />
    <rect x="155" y="5" width="90" height="40" rx="4" fill="#fff3f3" stroke="#8c3a3a" stroke-width="1.5" />
    <text x="200" y="30" text-anchor="middle" font-size="13" fill="#8c3a3a">System</text>
    <line x1="245" y1="25" x2="290" y2="25" stroke="#8c3a3a" stroke-width="1.5" marker-end="url(#arrowred)" />
    <text x="335" y="30" text-anchor="middle" font-size="16" fill="#8c3a3a">r₁ + r₂</text>
  </g>

  <!-- divider -->
  <line x1="20" y1="230" x2="620" y2="230" stroke="#c9c9c4" stroke-width="1" stroke-dasharray="4 4" />

  <!-- bracket label: scaling -->
  <text x="20" y="270" font-size="13" font-weight="700" fill="#3a5a8c">Scaling</text>

  <!-- Row D -->
  <g transform="translate(0,250)">
    <text x="70" y="30" text-anchor="middle" font-size="16" fill="#1a1a1a">k · i</text>
    <line x1="100" y1="25" x2="150" y2="25" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" />
    <rect x="155" y="5" width="90" height="40" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" />
    <text x="200" y="30" text-anchor="middle" font-size="13" fill="#1a1a1a">System</text>
    <line x1="245" y1="25" x2="305" y2="25" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="330" y="30" text-anchor="middle" font-size="16" fill="#1a1a1a">k · r</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a1a1a" />
    </marker>
    <marker id="arrowred" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8c3a3a" />
    </marker>
  </defs>
</svg>
