<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="520" height="340" fill="#f7f7f5" rx="10" />
  <text x="260" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Lumped body cooling in a surrounding fluid</text>

  <!-- surrounding fluid field -->
  <rect x="30" y="55" width="460" height="240" rx="14" fill="#eaf1fb" stroke="#3a5a8c" stroke-width="1.2" />
  <text x="50" y="80" font-size="14" fill="#3a5a8c">surrounding fluid, T∞</text>

  <!-- the body -->
  <circle cx="260" cy="195" r="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" />
  <text x="260" y="188" text-anchor="middle" font-size="15" fill="#1a1a1a">t = 0</text>
  <text x="260" y="208" text-anchor="middle" font-size="15" fill="#1a1a1a">T = Tᵢ</text>

  <!-- heat loss arrows radiating out -->
  <g stroke="#8c3a3a" stroke-width="1.8" fill="none" marker-end="url(#arrowout)">
    <line x1="260" y1="135" x2="260" y2="100" />
    <line x1="311" y1="160" x2="345" y2="130" />
    <line x1="311" y1="230" x2="345" y2="260" />
    <line x1="209" y1="160" x2="175" y2="130" />
    <line x1="209" y1="230" x2="175" y2="260" />
  </g>
  <text x="400" y="205" text-anchor="middle" font-size="13" fill="#8c3a3a">heat loss, E_loss</text>
  <text x="400" y="222" text-anchor="middle" font-size="13" fill="#8c3a3a">= hA(T − T∞)</text>

  <text x="260" y="330" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">find T(t)</text>

  <defs>
    <marker id="arrowout" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8c3a3a" />
    </marker>
  </defs>
</svg>
